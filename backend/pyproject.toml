[project]
name = "vyaparsetu-backend"
version = "0.1.0"
description = "Mock-first Malayalam voice ledger backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.33",
  "httpx==0.28.1",
  "openai==3.46.0",
  "gnani-vachana==0.9.0",
  "indic-numtowords==1.1.0",
  "imageio-ffmpeg==0.8.1",
  "ddgs==9.16.1",
  "extruct==0.18.0",
  "safehttpx==0.2.0",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
  "pypdf==6.21.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
